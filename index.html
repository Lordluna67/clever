<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Learning Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background-color: #6c5ce7;
            color: white;
            width: 100%;
            text-align: center;
            padding: 2rem 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 { margin: 0; font-size: 2.5rem; }
        p { margin: 0.5rem 0 0 0; font-size: 1.1rem; opacity: 0.9; }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 2rem 0;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .quiz-btn {
            background-color: #ffeaa7;
            border: 2px solid #fdcb6e;
            padding: 1rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .quiz-btn:hover {
            background-color: #fdcb6e;
            transform: scale(1.02);
        }

        #feedback {
            margin-top: 1rem;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 25px;
        }

        /* Next button layout styling */
        .next-btn {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 1rem;
            display: none;
            transition: background-color 0.2s;
        }
        .next-btn:hover {
            background-color: #5b4cc4;
        }

        footer {
            margin-top: auto;
            padding: 1rem;
            text-align: center;
            width: 100%;
            font-size: 0.9rem;
            color: #666;
            position: relative;
        }

        .tiny-btn {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #b2bec3;
            border: none;
            border-radius: 50%;
            text-decoration: none;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
            vertical-align: middle;
            margin-left: 5px;
        }

        .tiny-btn:hover {
            opacity: 1;
            background-color: #6c5ce7;
        }
    </style>
</head>
<body>

    <header>
        <h1>BrainQuest Academy 🚀</h1>
        <p>Where learning feels like playing!</p>
    </header>

    <div class="container">
        <div class="card">
            <h4 id="question-number" style="color: #6c5ce7; margin: 0 0 0.5rem 0;">Question 1 of 5</h4>
            <h2 id="question-text">Loading question...</h2>
            
            <div class="options-grid" id="options-container">
            </div>

            <p id="feedback"></p>
            <button id="next-button" class="next-btn" onclick="nextQuestion()">Next Question ➡️</button>
        </div>
    </div>

    <footer>
        <p>© 2026 BrainQuest Academy. Keep exploring</p>
        <a href="secretquiz.html" class="tiny-btn" title="Secret Link"></a>
    </footer>

    <script>
        const quizData = [
            {
                question: "Which celestial body is known as the 'Red Planet'?",
                options: ["Venus 🌟", "Mars 🔴", "Jupiter 🌀", "Saturn 🪐"],
                correct: 1,
                fact: "Mars is rich in iron oxide (rust), giving its surface a reddish tint."
            },
            {
                question: "What is the fastest land animal in the world?",
                options: ["Cheetah 🐆", "Pronghorn 🦌", "Lion 🦁", "Peregrine Falcon 🦅"],
                correct: 0,
                fact: "A cheetah can accelerate from 0 to 60 mph in less than 3 seconds!"
            },
            {
                question: "How many bones are there in an adult human body?",
                options: ["106 🦴", "206 🦴", "306 🦴", "406 🦴"],
                correct: 1,
                fact: "Humans are born with around 270 bones, but many fuse together as we grow."
            },
            {
                question: "Which ocean is the largest ocean on Earth?",
                options: ["Atlantic Ocean 🌊", "Indian Ocean 🌊", "Arctic Ocean ❄️", "Pacific Ocean 🌏"],
                correct: 3,
                fact: "The Pacific Ocean covers more area than all of Earth's continents combined!"
            },
            {
                question: "What gas do plants absorb from the atmosphere to perform photosynthesis?",
                options: ["Oxygen 💨", "Nitrogen 🧪", "Carbon Dioxide 🌱", "Hydrogen 💧"],
                correct: 2,
                fact: "Plants intake Carbon Dioxide and release clean Oxygen back into the air for us to breathe."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;

        function loadQuestion() {
            hasAnswered = false;
            const currentQuiz = quizData[currentQuestionIndex];
            
            document.getElementById("question-number").textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            document.getElementById("question-text").textContent = currentQuiz.question;
            document.getElementById("feedback").textContent = "";
            document.getElementById("next-button").style.display = "none";

            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            currentQuiz.options.forEach((optionText, index) => {
                const button = document.createElement("button");
                button.className = "quiz-btn";
                button.textContent = optionText;
                button.onclick = () => checkAnswer(index, button);
                optionsContainer.appendChild(button);
            });
        }

        function checkAnswer(selectedIndex, clickedButton) {
            if (hasAnswered) return; 
            hasAnswered = true;

            const currentQuiz = quizData[currentQuestionIndex];
            const feedback = document.getElementById("feedback");
            const buttons = document.getElementsByClassName("quiz-btn");

            for (let i = 0; i < buttons.length; i++) {
                buttons[i].style.cursor = "default";
                buttons[i].transform = "none";
            }

            if (selectedIndex === currentQuiz.correct) {
                score++;
                feedback.textContent = `🎉 Correct! ${currentQuiz.fact}`;
                feedback.style.color = "#2ecc71";
                clickedButton.style.backgroundColor = "#2ecc71";
                clickedButton.style.color = "white";
                clickedButton.style.borderColor = "#27ae60";
            } else {
                feedback.textContent = `❌ Not quite! ${currentQuiz.fact}`;
                feedback.style.color = "#e74c3c";
                clickedButton.style.backgroundColor = "#e74c3c";
                clickedButton.style.color = "white";
                clickedButton.style.borderColor = "#c0392b";
                
                buttons[currentQuiz.correct].style.backgroundColor = "#2ecc71";
                buttons[currentQuiz.correct].style.borderColor = "#27ae60";
                buttons[currentQuiz.correct].style.color = "white";
            }

            document.getElementById("next-button").style.display = "inline-block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById("question-number").textContent = "Quiz Complete! 🎓";
            document.getElementById("question-text").textContent = `You scored ${score} out of ${quizData.length}!`;
            document.getElementById("options-container").innerHTML = "";
            document.getElementById("feedback").textContent = score === quizData.length ? "🌟 Perfect Score! You're a genius!" : "Great effort! Refresh the page to try again.";
            document.getElementById("feedback").style.color = "#6c5ce7";
            document.getElementById("next-button").style.display = "none";
        }
        
        loadQuestion();
    </script>

</body>
</html>
